root = "."
tmp_dir = "tmp/air-agent"

[build]
cmd = "env GOCACHE=$PWD/.gocache GOPATH=$PWD/.gopath GOENV=off go build -o ./tmp/air-agent/nodewall-agent ./cmd/agent"
bin = "./tmp/air-agent/nodewall-agent"
delay = 300
exclude_dir = ["bin", ".git", ".gocache", ".gopath", "tmp/air-server", "tmp/air-agent", "web", "bpf/gen"]
include_ext = ["go", "tpl", "tmpl", "html"]
stop_on_error = true

[log]
time = true
